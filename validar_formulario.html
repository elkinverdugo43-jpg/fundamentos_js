<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar Formulario</title>
</head>
<body>
    <h1>Validar Contraseña de un Formulario</h1>

    <form onsubmit="return validarContrasena(); "method"post">
        <center>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" required>
        </br>
        </br>
        <label for="correo">Correo</label>
        <input type="email" id="correo" required>
        </br>
        </br>
        <label for="contra1">Contraseña</label>
        <input type="password" id="contra1" required>
        </br>
        </br>
        <label for="contra2">Confirmar Contraseña</label>
        <input type="password" id="contra2" required>
        </br>
        </br>
        <input type="submit" value="Enviar">
        </center>
    </form>

    <script src="validar_formulario.js"></script>
</body>
</html>
